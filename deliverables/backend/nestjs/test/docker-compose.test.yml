services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhiyi_test
      MYSQL_USER: zhiyi_test
      MYSQL_PASSWORD: local-isolated-password
      MYSQL_ROOT_PASSWORD: local-isolated-root-password
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-isolated-root-password"]
      interval: 2s
      timeout: 3s
      retries: 30
